server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router uses client-side routing — any unknown path falls back to
  # index.html rather than a 404 from the static file server.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Mirrors vite.config.ts's dev-server proxy: same-origin /api calls from the
  # browser, forwarded to the backend container (see root docker-compose.yml).
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
