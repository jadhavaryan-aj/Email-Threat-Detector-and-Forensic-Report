services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/sih.db
      - RAW_EMAIL_DIR=./data/raw_emails
      - CORS_ORIGINS=http://localhost
      # Optional — uncomment to enable real AI content analysis, threat-intel
      # enrichment, or the shared-secret API gate. See README "Deploying".
      # - ANTHROPIC_API_KEY=
      # - ABUSEIPDB_API_KEY=
      # - VIRUSTOTAL_API_KEY=
      # - BACKEND_API_KEY=
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
